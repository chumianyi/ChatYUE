# ChatYUE 固定签名配置
#
# 这个 keystore 用于所有正式版（release）构建，本地与云端共用同一份，
# 保证每次产出的 APK 签名一致，可以互相覆盖安装。
#
# 注意：本仓库为公开仓库，因此该 keystore 与口令是公开的。
# 如果你需要更强的安全性（防止他人冒名签发同包名应用），
# 请换成自己的私有 keystore，并把这份配置从仓库中移除。
storeFile=keystore/chatyue-release.jks
storePassword=ChatYUE-release-2026
keyAlias=chatyue
keyPassword=ChatYUE-release-2026
