name: veryoldDpSk Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: veryoldDpSk

jobs:
  build:
    name: Build veryoldDpSk (API 3+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本项目刻意使用 JDK 11 + AGP 7.4.2，与主应用（JDK 21 + AGP 9）完全隔离
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5.1"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-33" "build-tools;33.0.1" > /dev/null

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # NewApi 校验：确保没有任何高于 API 3 的接口调用，这是「不闪退」的关键保障
      - name: Lint (NewApi check against minSdk 3)
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veryoldDpSk-debug-apk
          path: veryoldDpSk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veryoldDpSk-lint-report
          path: veryoldDpSk/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
