name: veryoldDpSk Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: veryoldDpSk

jobs:
  build:
    name: veryoldDpSk (minSdk 3 / zero dependency)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gradle 7.5.1
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-7.5.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-7.5.1/bin" >> "$GITHUB_PATH"

      # 注意：sdkmanager 自身需要 JDK 17+（class file 61），
      # 因此这一步必须放在把 JAVA_HOME 切到 JDK 11 之前，否则会 UnsupportedClassVersionError。
      - name: Install Android SDK packages
        run: |
          set -e
          echo "sdkmanager JDK: $(java -version 2>&1 | head -1)"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-33" "build-tools;33.0.1" > /dev/null
          echo "build-tools 33.0.1 ready"

      # 本项目刻意使用 JDK 11 + AGP 7.4.2 + Gradle 7.5.1，
      # 与主应用（JDK 21 + AGP 8.13.2 + Compose）完全隔离。
      - name: Set up JDK 11 for build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      # 正式版：使用仓库内固定的 keystore 签名（../keystore.properties）
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/33.0.1"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -4

      - name: Lint
        run: gradle lintDebug --no-daemon --stacktrace

      # 硬校验 1：最低版本必须保持 3，谁都不许偷偷抬高
      - name: Verify minSdk stays at 3
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/33.0.1"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt
          echo "---- badging ----"
          grep -E "^package|^sdkVersion|^targetSdkVersion|^application-label" /tmp/badging.txt
          if ! grep -q "sdkVersion:'3'" /tmp/badging.txt; then
            echo "::error::minSdk is not 3, minimum supported version was changed"
            exit 1
          fi
          if grep -q "application-debuggable" /tmp/badging.txt; then
            echo "::error::this is a debuggable build, release expected"
            exit 1
          fi

      # 硬校验 2：lint 报告里出现 NewApi / InlinedApi，说明调用了高于 API 3 的接口，
      # 这类调用在真机上会 NoSuchMethodError 直接闪退，必须拦下来。
      - name: Verify no API-above-3 calls
        run: |
          set -e
          REPORT="app/build/reports/lint-results-debug.xml"
          if [ ! -f "$REPORT" ]; then
            echo "::error::lint xml report not found, cannot verify API compatibility"
            exit 1
          fi
          FOUND=0
          for ID in NewApi InlinedApi; do
            if grep -q "id=\"$ID\"" "$REPORT"; then
              echo "::error::$ID violation (will crash on old devices)"
              grep -o "id=\"$ID\"[^>]*" "$REPORT" | head -30
              FOUND=1
            fi
          done
          if [ "$FOUND" = "1" ]; then exit 1; fi

      - name: Collect APK
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cd app/build/outputs/apk/release
          for f in *.apk; do
            case "$f" in veryoldDpSk-*) continue;; esac
            mv "$f" "veryoldDpSk-${VERSION}-release.apk"
          done
          ls -l

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veryoldDpSk-release-apk
          path: veryoldDpSk/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veryoldDpSk-lint-report
          path: |
            veryoldDpSk/app/build/reports/lint-results-debug.html
            veryoldDpSk/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
