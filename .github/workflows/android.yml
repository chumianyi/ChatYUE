name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub 的 ubuntu runner 已预装 Android SDK 与 cmdline-tools，
      # 这里只补装本项目需要的 platform 与 build-tools。
      - name: Install Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "build-tools;36.1.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      # 正式版：使用仓库内固定的 keystore 签名（keystore.properties）
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | grep -E "^package|^application-label:"

      - name: Collect APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd app/build/outputs/apk/release
          for f in *.apk; do
            case "$f" in ChatYUE-*) continue;; esac
            mv "$f" "ChatYUE-${VERSION}-release.apk"
          done
          ls -l

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatYUE-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 把 APK 提交到 apk-release 分支，供自动更新链路与离线分发拉取。
      - name: 发布 APK 到 apk-release 分支
        run: |
          APK="app/build/outputs/apk/release/ChatYUE-${VERSION}-release.apk"
          test -f "$APK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-release
          git rm -rf --cached . >/dev/null
          rm -rf app .github gradle .gitignore *.md *.properties *.txt settings.gradle.kts 2>/dev/null || true
          cp "$APK" .
          git add "ChatYUE-${VERSION}-release.apk"
          git commit -m "release: ChatYUE ${VERSION}"
          git push -f origin apk-release

      # 正式发版：附带签名 APK 的 GitHub Release（runner 自带 gh CLI）。
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" app/build/outputs/apk/release/*.apk --clobber
          else
            gh release create "v$VERSION" app/build/outputs/apk/release/*.apk \
              --title "ChatYUE ${VERSION}" --latest
          fi

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChatYUE-unit-test-report
          path: app/build/reports/tests/test
          if-no-files-found: ignore
